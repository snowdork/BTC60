name: p60-local

services:
  app:
    build: .
    image: p60:local
    container_name: p60-local
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${P60_PORT:-8085}:8000"
    environment:
      P60_HOST: http://localhost:${P60_PORT:-8085}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-572697973282-e17b6uqatr36toqi48sohg6vigkarvai.apps.googleusercontent.com}
      P60_SIGNUP_CODE: ${P60_SIGNUP_CODE:-}
      PREDICT60_DB: /app/data/p60.sqlite3
      PREDICT60_LOG_LEVEL: normal
    volumes:
      - data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

volumes:
  data:
    name: p60-local-data
